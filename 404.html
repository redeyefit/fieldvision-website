<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldVision</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://getfieldvision.ai/">
    <!--
      GitHub Pages serves this file for every path that has no file in this repo. It forwards
      the same path, query and hash to the bare domain, where the live site answers
      (so www.getfieldvision.ai/privacy lands on getfieldvision.ai/privacy).
      The meta refresh is the no-script path and can only send people to the home page.
    -->
    <script>
        location.replace("https://getfieldvision.ai" + location.pathname + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://getfieldvision.ai/">
</head>
<body>
    <p>FieldVision is at <a href="https://getfieldvision.ai/">getfieldvision.ai</a>.</p>
</body>
</html>
