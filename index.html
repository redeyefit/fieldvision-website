<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldVision</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://getfieldvision.ai/">
    <!--
      This repo no longer hosts the site. The live site is the Vercel project behind
      getfieldvision.ai. GitHub Pages still answers for www.getfieldvision.ai (the www DNS
      record points here), so every page of this repo only forwards to the bare domain.
      The script runs first and keeps the query and hash; the meta refresh is the no-script path.
    -->
    <script>
        location.replace("https://getfieldvision.ai/" + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://getfieldvision.ai/">
</head>
<body>
    <p>FieldVision is at <a href="https://getfieldvision.ai/">getfieldvision.ai</a>.</p>
</body>
</html>
